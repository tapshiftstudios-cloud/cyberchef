name: cyberchef
description: Smart Pantry & AI Recipe Architect — identify fridge contents and generate AI recipes.
publish_to: "none"
version: 1.0.3+17

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  google_generative_ai: ^0.4.7
  image: ^4.5.4
  supabase_flutter: ^2.9.1
  shared_preferences: ^2.5.3
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  path_provider: ^2.1.5
  home_widget: ^0.7.0
  mobile_scanner: ^6.0.2
  http: ^1.2.2
  sentry_flutter: ^9.20.0
  in_app_purchase: ^3.2.3
  google_mobile_ads: ^7.0.0
  package_info_plus: ^8.0.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/config/cyberchef.env
